<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15120e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">
<title>Susie & Dima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#15120e; --ink:#f3ede4; --dim:#a89f92; --paper:#fbf9f4; --accent:#d9b56c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
            font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%,transparent 40%,#000a 100%)}
  button{font:inherit}

  /* ---------- hero ---------- */
  #hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;pointer-events:none;z-index:20;padding:24px;transition:opacity .4s,transform .4s}
  #hero.gone{opacity:0;transform:scale(.96)}
  #hero.gone > *{pointer-events:none}
  #hero > *{pointer-events:auto}
  #hero::before{content:"";position:absolute;width:min(70vw,720px);height:min(50vh,360px);border-radius:50%;
    background:radial-gradient(ellipse,#15120ee6 0%,#15120eaa 45%,transparent 72%);z-index:-1}
  #hero h1{font:italic 400 clamp(44px,8vw,92px)/1 "Cormorant Garamond",serif;letter-spacing:.02em;
           text-shadow:0 2px 30px #000c,0 0 80px #0009}
  #hero h1 span{font-style:normal;font-weight:600}
  #sub{margin-top:10px;color:var(--dim);letter-spacing:.32em;text-transform:uppercase;font-size:12px;text-shadow:0 1px 12px #000;white-space:nowrap}
  #greet{margin-top:0;font:italic 400 clamp(40px,7vw,72px)/1.1 "Cormorant Garamond",serif;color:var(--ink);
         text-shadow:0 2px 20px #000c;display:none}
  #greet b{font-style:normal;font-weight:600;color:var(--accent)}
  #greet small{display:block;font-size:.72em;color:var(--dim);margin-top:4px}
  #greet.on{display:block}
  #cta{position:relative;margin-top:26px;padding:15px 26px 15px 22px;border:0;border-radius:999px;background:var(--ink);
       color:var(--bg);font:600 14px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
       display:inline-flex;align-items:center;gap:10px;box-shadow:0 10px 30px #0009,0 0 0 0 #f3ede466;
       transition:transform .2s,opacity .3s,box-shadow .2s;animation:pulse 2.4s ease-out infinite}
  #cta svg{width:20px;height:20px;flex:none}
  #cta .chev{margin-left:2px;font-weight:400;font-size:16px;opacity:.7}
  #cta:hover{transform:translateY(-1px) scale(1.03);animation:none;box-shadow:0 14px 34px #000b}
  #cta:active{transform:scale(.98)}
  @keyframes pulse{0%{box-shadow:0 10px 30px #0009,0 0 0 0 #f3ede466}70%{box-shadow:0 10px 30px #0009,0 0 0 14px #f3ede400}100%{box-shadow:0 10px 30px #0009,0 0 0 0 #f3ede400}}
  #tophint{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;z-index:21;display:none;justify-content:center;
           pointer-events:none}
  #tophint span{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:#1f1a15;
                color:var(--ink);font-size:11.5px;letter-spacing:.06em;border:1px solid #ffffff22;box-shadow:0 4px 18px #000a}
  #tophint svg{width:15px;height:15px}
  #hero.gone ~ #tophint{opacity:0}
  #cta.busy{opacity:.6;pointer-events:none}
  #hint{margin-top:14px;color:var(--dim);font-size:11.5px;letter-spacing:.06em;opacity:.8}
  #nolink{margin-top:22px;max-width:340px;padding:12px 18px;border-radius:12px;background:#1f1a15;border:1px solid #ffffff22;
          color:var(--ink);font-size:14px;line-height:1.45;box-shadow:0 6px 24px #000a}

  /* ---------- desktop: drifting polaroids ---------- */
  #drift{position:fixed;inset:0;overflow:hidden}
  .card{position:absolute;left:0;top:0;background:var(--paper);padding:11px 11px 40px;
        box-shadow:0 12px 40px #000b,0 2px 6px #0008;will-change:transform;cursor:grab;transition:box-shadow .3s;
        user-select:none;-webkit-user-drag:none;touch-action:none}
  .card.drag{cursor:grabbing}
  .card img{display:block;width:100%;height:auto;background:#222;pointer-events:none;-webkit-user-drag:none}
  .card:hover{box-shadow:0 30px 70px #000d,0 4px 10px #000a}

  /* ---------- mobile: film reel ---------- */
  #reel{display:none;position:fixed;inset:0;overflow:hidden;transform:rotate(-2.5deg) scale(1.12);touch-action:none}
  #strip{position:absolute;left:50%;top:-6vh;width:86vw;transform:translateX(-50%);
         background:#0b0a09;padding:0 9vw;box-shadow:0 0 60px #000,inset 0 0 0 1px #000}
  #strip::before,#strip::after{content:"";position:absolute;top:0;bottom:0;width:4.2vw;
    background:repeating-linear-gradient(to bottom,transparent 0 2.4vw,#3a3631 2.4vw 5.2vw,transparent 5.2vw 7.6vw);opacity:.9}
  #strip::before{left:2.2vw} #strip::after{right:2.2vw}
  #track{will-change:transform}
  .frame{padding:3.2vw 0}
  .frame .ph{position:relative;width:100%;background:#151210}
  .frame img{position:absolute;inset:0;display:block;width:100%;height:100%;border:1px solid #000;filter:saturate(1.05) contrast(1.04);
             -webkit-user-drag:none;pointer-events:none}
  @media (max-width:767px), (pointer:coarse) and (max-width:1024px){
    #drift{display:none} #reel{display:block}
    #hero{justify-content:flex-end;padding-bottom:max(48px,env(safe-area-inset-bottom) + 34px)}
    #hero::before{width:100vw;height:60vh;bottom:0;border-radius:0;
      background:linear-gradient(to bottom,transparent,#15120ecc 45%,#15120ef5)}
    #hero h1{font-size:clamp(40px,12vw,64px)} #sub{font-size:10.5px;letter-spacing:.22em} #cta{margin-top:18px}
    #greet{font-size:clamp(36px,11vw,52px)}
    #hint{display:none} #tophint{display:flex;transition:opacity .4s}
  }

  /* ---------- shared UI ---------- */
  .btn{padding:10px 16px;border:1px solid #f3ede455;border-radius:999px;background:transparent;color:var(--ink);
       font:500 12px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;
       text-decoration:none;display:inline-block}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn.on{background:var(--accent);color:#15120e;border-color:var(--accent)}
  .btn:disabled{opacity:.35;cursor:default}
  .overlay{position:fixed;inset:0;z-index:40;background:#15120ef2;backdrop-filter:blur(14px);display:flex;
           opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease,visibility 0s .55s}
  .overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .55s ease,visibility 0s}
  #count{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;
         pointer-events:none}
  #skip{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);
        padding:9px 18px;border-radius:999px;border:1px solid #ffffff22;background:#00000066;color:#f3ede4;
        font:500 11.5px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:0;pointer-events:none;
        transition:opacity .6s;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #skip.show{opacity:.55;pointer-events:auto} #skip:hover{opacity:.9}
  #count.open{display:flex}
  #count b{font:italic 400 clamp(120px,32vw,220px)/1 "Cormorant Garamond",serif;color:var(--ink);
           text-shadow:0 4px 40px #000,0 0 120px #000c;animation:tickin 1s ease-out both}
  @keyframes tickin{0%{opacity:0;transform:scale(1.25)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.92)}}
  #fade{position:fixed;inset:0;z-index:35;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
  #fade.on{opacity:1}
  #confetti{position:fixed;inset:0;z-index:48;pointer-events:none}

  /* ---------- gallery: viewer + grid ---------- */
  #gal{flex-direction:column;overflow:hidden}
  #galbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #ffffff14;flex-wrap:wrap}
  #galbar h2{font:italic 400 24px/1 "Cormorant Garamond",serif;flex:1;min-width:0;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  #galbar h2 b{font-style:normal;font-weight:600}
  #galbar .n{color:var(--dim);font-size:13px;white-space:nowrap}
  #galbody{flex:1;min-height:0;display:flex}
  #viewer{position:relative;flex:1.5;min-width:0;min-height:0;display:flex;flex-direction:column;background:#0a0908;
          touch-action:pan-y}
  #vpic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
  #vpic img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 50px #000;transition:opacity .2s}
  #vpic img.swap{opacity:0}
  #vbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px;flex-wrap:wrap;
        border-top:1px solid #ffffff10}
  #vbar .n{color:var(--dim);font-size:12px;margin-right:6px}
  .nav{position:absolute;top:40%;width:44px;height:44px;border-radius:50%;border:0;background:#fff2;color:#fff;
       font-size:22px;cursor:pointer;z-index:1}
  #prev{left:10px} #next{right:10px}
  #galgrid{width:36%;min-width:260px;overflow-y:auto;padding:12px;display:grid;gap:8px;align-content:start;
           grid-template-columns:repeat(auto-fill,minmax(110px,1fr));-webkit-overflow-scrolling:touch;
           border-left:1px solid #ffffff10}
  .g{position:relative;padding-top:100%;background:#000;cursor:pointer;overflow:hidden;border-radius:4px;
     outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s;-webkit-tap-highlight-color:transparent}
  .g.cur{outline-color:var(--ink)}
  .g img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
  .g .tick{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;
           background:#0006;display:none;place-items:center;font-size:13px;color:transparent;z-index:1}
  #gal.selecting .g .tick,.g.sel .tick{display:grid}
  .g.sel .tick{background:var(--accent);border-color:var(--accent);color:#15120e}
  .g.sel img{opacity:.7}
  #galfoot{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-top:1px solid #ffffff14;
           padding-bottom:max(12px,env(safe-area-inset-bottom))}
  #galfoot .row{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  #galfoot .hint{flex:1;color:var(--dim);font-size:12px;min-width:160px}
  #galfoot #selrow{padding:8px 12px;border-radius:12px;background:#ffffff0a;border:1px solid #ffffff12}
  #galfoot #selrow:not(.on){display:none}
  .shareonly{display:none} body.canshare .shareonly{display:inline-flex;align-items:center;justify-content:center}
  body.canshare .zipbtn{display:none}
  #gal.selecting .g{cursor:copy}
  #gal.selecting #vpic::after{content:"Tap photos below to select them";position:absolute;left:50%;top:10px;transform:translateX(-50%);
    padding:6px 12px;border-radius:999px;background:#0009;color:#fff;font-size:11.5px;letter-spacing:.04em;white-space:nowrap}
  #vpic{position:relative}
  #selinfo{flex:1;font-size:13px;color:var(--ink);white-space:nowrap}
  #selinfo .lnk{margin-left:6px}
  #vclose{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:#0009;
          color:#fff;font-size:20px;line-height:1;cursor:pointer;z-index:2;display:none;backdrop-filter:blur(6px)}
  @media (max-width:767px), (pointer:coarse) and (max-width:1024px){
    #galbody{flex-direction:column}
    #viewer{flex:none;height:46%}
    #vpic{padding:8px}
    .nav{display:none}
    #galgrid{width:auto;min-width:0;flex:1;min-height:0;border-left:0;border-top:1px solid #ffffff10;
             grid-template-columns:repeat(4,1fr);gap:3px;padding:4px}
    .g{border-radius:2px}
    #galbar{display:none} #vclose{display:block;top:9px;left:10px;right:auto;width:36px;height:36px}
    #vbar{order:-1;padding:10px 12px 10px 54px;justify-content:flex-start;border-top:0;border-bottom:1px solid #ffffff10}
    #vn{display:none}
    #galfoot{gap:8px;padding:10px 12px} .btn{padding:11px 13px;font-size:11px}
    #galfoot .row{justify-content:stretch} #galfoot .row .btn{flex:1;text-align:center}
    #galfoot .hint{flex-basis:100%;text-align:center;min-width:0;font-size:11.5px;line-height:1.35;padding:0 8px}
    #selrow{padding:8px 10px} #selinfo{flex-basis:100%;text-align:center}
    #viewer{height:50%}
  }

  /* ---------- booth strip + guestbook ---------- */
  #gbbox{align-items:center;justify-content:center;padding:20px;z-index:52}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #gbbox .box{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px}
  #gbbox h2{font:italic 400 32px/1.1 "Cormorant Garamond",serif}
  #gbbox .sub{color:var(--dim);font-size:13px;margin-top:-6px}
  #gbmsg{width:100%;min-height:100px;padding:12px 14px;border:1px solid #f3ede455;border-radius:12px;background:#0000;
         color:var(--ink);font:inherit;resize:vertical;outline:none}
  #gbmsg:focus{border-color:var(--accent)}
  #gbwall{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding-right:4px}
  .note{background:#ffffff0a;border:1px solid #ffffff12;border-radius:10px;padding:10px 14px;font-size:14px}
  .note b{color:var(--accent);font-weight:500} .note small{color:var(--dim);margin-left:8px;font-size:11px}
  .note p{white-space:pre-wrap;margin-top:3px}
  #gbempty{color:var(--dim);font-size:13px;text-align:center;padding:14px}
  #gbBtn{margin-top:12px;background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;letter-spacing:.06em;
         cursor:pointer;text-decoration:underline;text-underline-offset:4px;display:none}
  #gbBtn.on{display:inline} #gbBtn:hover{color:var(--ink)}
  #gbBtn2{display:none} #gbBtn2.on{display:inline-block}

  /* ---------- slideshow: full-width film reel ---------- */
  #show{position:fixed;inset:0;z-index:55;background:#000;display:none;overflow:hidden}
  #show.open{display:block}
  #sreel{position:absolute;inset:0;overflow:hidden;touch-action:none}
  #sstrip{position:absolute;left:50%;top:0;bottom:0;width:min(96vw,900px);transform:translateX(-50%);background:#0b0a09;
          padding:0 min(3.6vw,34px);box-shadow:0 0 60px #000,inset 0 0 0 1px #000}
  #sstrip::before,#sstrip::after{content:"";position:absolute;top:0;bottom:0;width:min(1.8vw,17px);opacity:.9;
    background:repeating-linear-gradient(to bottom,transparent 0 1.3vw,#3a3631 1.3vw 2.9vw,transparent 2.9vw 4.2vw)}
  #sstrip::before{left:min(.9vw,8px)} #sstrip::after{right:min(.9vw,8px)}
  #strack{will-change:transform}
  #strack .frame{padding:min(2vw,18px) 0}
  #strack .frame img{filter:none}
  #show .ctl{position:absolute;left:0;right:0;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:center;gap:6px;
             padding:0 12px;z-index:2;opacity:.92}
  #show .ctl button{padding:8px 12px;border-radius:999px;border:1px solid #ffffff33;background:#0009;color:#fff;font:500 11px/1 Inter,sans-serif;
                    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
  #show .ctl button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  #show .ctl #sx{font-size:16px;padding:6px 12px}
  .lnk{background:none;border:0;color:var(--dim);font:inherit;font-size:11.5px;letter-spacing:.04em;cursor:pointer;
       text-decoration:underline;text-underline-offset:3px;padding:0}
  .lnk:hover{color:var(--ink)}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f3ede4;color:#15120e;
         padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;z-index:60;
         pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1}
</style>
</head>
<body>

<div id="drift"></div>
<div id="reel"><div id="strip"><div id="track"></div></div></div>
<div id="count"><b>10</b><button id="skip">skip ›</button></div>
<div id="fade"></div>
<canvas id="confetti"></canvas>

<div id="tophint"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>Drag the film to scroll it</span></div>
<div id="hero">
  <h1>Susie <span>&amp;</span> Dima</h1>
  <p id="sub">Thank you for celebrating with us</p>
  <p id="greet"></p>
  <p id="nolink" style="display:none"></p>
  <button id="cta" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/></svg><span id="ctatxt">Show my photos</span><span class="chev">›</span></button>
  <p id="hint"></p>
  <button id="gbBtn">Leave us a note ✍</button>
</div>

<div id="gal" class="overlay">
  <div id="galbar">
    <h2 id="galtitle"></h2>
    <span class="n" id="galn"></span>
    <button class="btn" id="gbBtn2">Guestbook</button>
    <button class="btn" id="selmode">Select</button>
    <button class="btn" id="galclose">Close</button>
  </div>
  <div id="galbody">
    <div id="viewer">
      <button id="vclose" aria-label="Close">×</button>
      <button class="nav" id="prev" aria-label="Previous">‹</button>
      <button class="nav" id="next" aria-label="Next">›</button>
      <div id="vpic"><img id="vimg" alt=""></div>
      <div id="vbar">
        <span class="n" id="vn"></span>
        <a class="btn primary" id="vdl" download>↓ Save</a>
        <button class="btn" id="vsel">Multiselect</button>
        <button class="btn" id="play" title="Slideshow">▶ Play</button>
      </div>
    </div>
    <div id="galgrid"></div>
  </div>
  <div id="galfoot">
    <div class="row" id="selrow">
      <span id="selinfo"></span>
      <button class="btn primary shareonly" id="selPhotos" data-label="">Save to Photos</button>
      <button class="btn primary zipbtn" id="dlsel">Download</button>
      <button class="btn" id="selclear">Clear</button>
    </div>
    <div class="row">
      <span class="hint" id="galhint"></span>
      <button class="btn primary shareonly" id="allPhotos" data-label="">Save all to Photos</button>
      <button class="btn primary zipbtn" id="dlall">Download all</button>
    </div>
  </div>
</div>
<div id="show"><div id="sreel"><div id="sstrip"><div id="strack"></div></div></div><div class="ctl"><button id="sx" aria-label="Exit">×</button><button data-sp="7">Slow</button><button data-sp="4.2" class="on">Normal</button><button data-sp="2.2">Fast</button><button id="sfav">♥ Selected</button></div></div>
<div id="gbbox" class="overlay"><div class="box">
  <h2>Guestbook</h2>
  <div class="sub">Everyone with a link can read these.</div>
  <textarea id="gbmsg" maxlength="600" placeholder="Write something…"></textarea>
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="gbClose">Close</button>
    <button class="btn primary" id="gbSend">Send</button>
  </div>
  <div id="gbwall"><div id="gbempty">Loading notes…</div></div>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
const $ = s => document.querySelector(s);
const mb = b => (b / 1e6).toFixed(b < 20e6 ? 1 : 0) + ' MB';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const isMobile = () => matchMedia('(max-width:767px), (pointer:coarse) and (max-width:1024px)').matches;
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
                del: k => { try { localStorage.removeItem(k); } catch (e) {} } };

const FILES_FALLBACK = 'https://pub-24efede884af4056b17024d7b118e97a.r2.dev';
let PLATFORM = 'desktop', FILES = '', GUESTBOOK = '', showcase = [], guest = null, key = '', pendingKey = '', cur = 0, revealed = false;
const sel = new Set();
const AMBIENT_TOTAL = 20, AMBIENT_GUEST_MAX = 10, CLIENT_ZIP_MAX = 400e6;

(async function init(){
  const fresh = {cache: 'no-store'};
  let cfg = {};

/* ================= ambient photo mix ================= */
const url = (kind, p) => `${FILES}/${kind}/${p.id}.${kind === 'o' ? p.ext : 'jpg'}`;   // t thumb · p preview · l large (default download) · o original
const lname = p => p.name.replace(/\.[^.]+$/, '.jpg');                                      // large tier is always jpg
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function ambientList(){
  const pinned = showcase.filter(p => p.pin).map(p => ({...p, f: p.m || p.f})), rest = shuffle(showcase.filter(p => !p.pin).map(p => ({...p, f: p.m || p.f})));
  const mine = guest ? pickDiverse(guest.photos, AMBIENT_GUEST_MAX).map(p => ({f: url('m', p), w: p.w, h: p.h})) : [];
  const fill = rest.slice(0, Math.max(0, AMBIENT_TOTAL - pinned.length - mine.length));
  // The guest's own photos lead and alternate with ours: with 10 they rotate all the way through,
  // with a few they sit right at the start so the first thing anyone sees is themselves.
  const ours = shuffle([...pinned, ...fill]), out = [];
  for (let i = 0, j = 0; i < mine.length || j < ours.length;){
    if (i < mine.length) out.push(mine[i++]);
    if (j < ours.length) out.push(ours[j++]);
  }
  return out;
}

// Greedy farthest-first on the perceptual hash the build attaches to each photo: burst shots of one
// moment look alike, so they rarely both get picked. Falls back to random if hashes are missing.
function pickDiverse(photos, n){
  if (photos.length <= n) return shuffle(photos);
  if (!photos.every(p => p.ph)) return shuffle(photos).slice(0, n);
  const dist = (a, b) => { let x = BigInt('0x' + a) ^ BigInt('0x' + b), c = 0; while (x){ c += Number(x & 1n); x >>= 1n; } return c; };
  const pool = shuffle(photos), out = [pool.pop()];
  while (out.length < n && pool.length){
    let best = -1, bi = 0;
    pool.forEach((p, i) => { const d = Math.min(...out.map(o => dist(o.ph, p.ph))) + Math.random() * .5; if (d > best){ best = d; bi = i; } });
    out.push(pool.splice(bi, 1)[0]);
  }
  return shuffle(out);
}

/* ================= film reels (landing + slideshow share one engine) ================= */
function createReel(container, track, secs){
  const R = { y: 0, speed: 0, n: 0, run: null, touch: null, coast: 0, secs, frames: [] };
  R.build = list => {
    track.innerHTML = (list.map(p => `<div class="frame"><div class="ph" style="padding-top:${(100 * (p.h || 2) / (p.w || 3)).toFixed(2)}%"><img src="${p.f}" alt="" decoding="async"></div></div>`).join('')).repeat(2);
    R.n = list.length; R.y = 0; R.speed = 0; R.frames = [...track.children];
  };
  R.jumpTo = i => { const f = R.frames[i]; if (f) R.y = f.offsetTop; };
  R.nearest = () => {                                               // which photo is nearest the middle of the screen
    const half = track.offsetHeight / 2, mid = R.y + container.clientHeight / 2; let best = 0, bd = 1e9;
    R.frames.slice(0, R.n).forEach((f, i) => { const c = f.offsetTop + f.offsetHeight / 2; const d = Math.min(Math.abs(c - mid), Math.abs(c + half - mid)); if (d < bd){ bd = d; best = i; } });
    return best;
  };

    const half = track.offsetHeight / 2;

    const photoH = half / R.n, base = photoH / R.secs, now = performance.now();

      if (p >= 1 && R.run.done){ const d = R.run.done; R.run = null; d(); }
    }
    else if (now < R.coast) R.speed += (base - R.speed) * Math.min(1, dt * 1.5);
    else R.speed += (base - R.speed) * Math.min(1, dt * 4);
    R.y = ((R.y + R.speed * dt) % half + half) % half;
    track.style.transform = `translate3d(0,${-R.y}px,0)`;
  };
  container.addEventListener('touchstart', e => { if (R.run) return; const y = e.touches[0].clientY; R.touch = {y, ly: y, lt: performance.now(), v: 0}; }, {passive: true});
  container.addEventListener('touchmove', e => {
    const t = R.touch; if (!t) return;
    const y = e.touches[0].clientY, now = performance.now(), dt = Math.max(1, now - t.lt) / 1000, dy = y - t.ly; t.ly = y; t.lt = now;
    t.v = t.v * .4 + (-dy / dt) * .6;

  return R;
}

const cards = [];
let gather = null;
function buildDrift(list){
  const wrap = $('#drift'); wrap.innerHTML = ''; cards.length = 0;
  const W = innerWidth, H = innerHeight, n = list.length;
  const base = Math.min(270, W / Math.max(5.6, Math.sqrt(n) * 1.9));
  list.forEach((p, i) => {
    const el = document.createElement('div'); el.className = 'card';
    const w = p.w >= p.h ? base * 1.15 : base * 0.82;
    el.style.width = w + 'px';
    el.innerHTML = `<img src="${p.f}" alt="" draggable="false">`;
    wrap.appendChild(el);
    const h = w * (p.h / p.w) + 51;
    const c = { el, w, h,
      x: (i % 2 ? W * .55 : 0) + Math.random() * (W * .45 - w * .6),
      y: (Math.floor(i / 2) / Math.ceil(n / 2)) * (H - h * .6) + Math.random() * 40 - 20,
      vx: (Math.random() < .5 ? -1 : 1) * (8 + Math.random() * 10),
      vy: (Math.random() < .5 ? -1 : 1) * (5 + Math.random() * 8),
      rot: -9 + Math.random() * 18, rotv: (Math.random() - .5) * 1.2, hover: false, lift: 0, drag: null, flung: false };
    el.addEventListener('mouseenter', () => { if (!c.drag) c.hover = true; el.style.zIndex = 30; });
    el.addEventListener('mouseleave', () => { if (!c.drag){ c.hover = false; el.style.zIndex = ''; } });
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag');
      c.drag = {ox: e.clientX - c.x, oy: e.clientY - c.y, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY,
                lt: performance.now(), vx: 0, vy: 0};

    });
    el.addEventListener('pointermove', e => {
      const d = c.drag; if (!d) return;

      d.lx = e.clientX; d.ly = e.clientY; d.lt = now;

function driftTick(dt){

function confetti(){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#d9b56c', '#fbf9f4', '#ff8b5a', '#c9a2ff', '#8fd3c8'], W = innerWidth, H = innerHeight;
  const ps = Array.from({length: 140}, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45,
    vx: (Math.random() - .5) * 900, vy: -300 - Math.random() * 700, r: 3 + Math.random() * 5,
    a: Math.random() * 6.3, av: (Math.random() - .5) * 12, c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  setTimeout(() => ctx.clearRect(0, 0, W, H), 2600);
  (function frame(now){
    const t = (now - t0) / 1000; if (t > 2.2){ ctx.clearRect(0, 0, W, H); return; }
    ctx.clearRect(0, 0, W, H);
    for (const p of ps){
      p.vy += 1400 / 60; p.vx *= .985; p.x += p.vx / 60; p.y += p.vy / 60; p.a += p.av / 60;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = clamp(2.2 - t, 0, 1);

    }
    requestAnimationFrame(frame);
  })(t0);
}

  try {
    const r = await fetch(`${GUESTBOOK}/notes`, {method: 'POST', headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify({key, name: guest.name, message})});
    if (!r.ok) throw new Error(r.status);
    $('#gbmsg').value = '';
    const wall = $('#gbwall'); if ($('#gbempty')) wall.innerHTML = '';
    wall.insertAdjacentHTML('afterbegin', `<div class="note"><b>${esc(guest.name)}</b><small>just now</small><p>${esc(message)}</p></div>`);
    toast('Thank you ❤'); confetti();
  } catch (e) { toast('Could not send — please try again'); }
  finally { btn.disabled = false; btn.textContent = 'Send'; }
}

/* ================= slideshow: the guest's photos as a full-width reel ================= */
const show_ = { on: false, fav: false, list: [] };
function slideshow(start){
  const el = $('#show');
  if (!start){ show_.on = false; el.classList.remove('open'); return; }
  show_.fav = show_.fav && sel.size > 1;
  show_.list = show_.fav ? [...sel].sort((a, b) => a - b) : guest.photos.map((_, i) => i);
  $('#sfav').style.display = sel.size > 1 ? '' : 'none'; $('#sfav').classList.toggle('on', show_.fav);
  const kind = isMobile() ? 'm' : 'p';
  el.classList.add('open');                                        // open first so frames have layout
  sreel.build(show_.list.map(i => ({f: url(kind, guest.photos[i]), w: guest.photos[i].w, h: guest.photos[i].h})));
  const at = show_.list.indexOf(cur); sreel.jumpTo(at < 0 ? 0 : at); sreel.tick(0);
  show_.on = true;
}
function slideExit(){ const i = show_.list[sreel.nearest()]; slideshow(false); if (i != null) show(i, true); }

/* ================= save to Photos (share sheet with files) ================= */
const fileCache = new Map();                       // oid -> File (large tier), for one-tap single saves
async function fetchFile(p){
  if (fileCache.has(p.id)) return fileCache.get(p.id);
  const r = await fetch(url('l', p), {signal: AbortSignal.timeout ? AbortSignal.timeout(45000) : undefined}); if (!r.ok) throw new Error('photo ' + r.status);
  const f = new File([await r.blob()], lname(p), {type: 'image/jpeg'});
  if (fileCache.size > 40) fileCache.delete(fileCache.keys().next().value);
  fileCache.set(p.id, f); return f;
}
function prefetchFile(p){ fetchFile(p).catch(() => {}); }
async function shareFiles(files){
  try { await navigator.share({files, title: 'Susie & Dima'}); return true; }
  catch (e) { if (e.name !== 'AbortError') toast('Could not open the share sheet: ' + (e.message || e)); return false; }
}
const batchQ = { all: null, sel: null };            // pending batches per button
async function saveToPhotos(which, indexes, btn){
  if (PLATFORM === 'android'){                      // straight to Downloads -> Gallery picks them up
    if (btn.disabled) return;
    const items = indexes.map(i => guest.photos[i]);
    if (items.length > 1 && !confirm(`Save ${items.length} photos to your phone?\n\nIf your browser asks to allow multiple downloads, tap Allow. They land in Downloads / Gallery.`)) return;
    btn.disabled = true;
    for (let i = 0; i < items.length; i++){
      const a = document.createElement('a'); a.href = url('l', items[i]); a.download = lname(items[i]); a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      btn.textContent = `Saving ${i + 1} / ${items.length}`;
      await new Promise(r => setTimeout(r, 700));
    }
    btn.textContent = btn.dataset.label; btn.disabled = false;
    toast('Done — check your Gallery or Downloads'); confetti();
    setTimeout(() => toast('Nothing arrived? Refresh the page and try again, or use the zip'), 5000);
    return;
  }
  const q = batchQ[which];
  if (q){                                           // a batch is ready: share it inside this tap
    if (await shareFiles(q.batches[q.i])) q.i++;
    if (q.i >= q.batches.length){ batchQ[which] = null; btn.textContent = btn.dataset.label; toast('All saved ❤'); confetti(); }
    else btn.textContent = `Save batch ${q.i + 1} of ${q.batches.length}`;
    return;
  }
  const items = indexes.map(i => guest.photos[i]), total = items.reduce((s, p) => s + p.lb, 0);
  btn.disabled = true; let done = 0;
  try {
    const files = [];
    for (const p of items){ files.push(await fetchFile(p)); done += p.lb; btn.textContent = `Getting photos… ${Math.round(done / total * 100)}%`; }
    const batches = []; let b = [], size = 0;
    for (const f of files){ if (b.length >= 20 || size + f.size > 60e6){ batches.push(b); b = []; size = 0; } b.push(f); size += f.size; }
    if (b.length) batches.push(b);
    batchQ[which] = {batches, i: 0};
    btn.textContent = batches.length > 1 ? `Save batch 1 of ${batches.length}` : 'Tap to save';
    toast(batches.length > 1 ? `Ready — ${batches.length} batches, tap Save each time` : 'Ready — tap again, then choose Save Images');
  } catch (e) { toast('Could not fetch the photos: ' + (e.message || e)); btn.textContent = btn.dataset.label; }
  finally { btn.disabled = false; }
}

/* ================= wiring ================= */
function wire(){
  wireReel();
  $('#cta').addEventListener('click', ctaClick);
  $('#galclose').addEventListener('click', closeGallery);
  $('#vclose').addEventListener('click', closeGallery);
  $('#play').addEventListener('click', () => slideshow(true));
  $('#allPhotos').addEventListener('click', e => saveToPhotos('all', guest.photos.map((_, i) => i), e.currentTarget));
  $('#selPhotos').addEventListener('click', e => saveToPhotos('sel', [...sel].sort((a, b) => a - b), e.currentTarget));
  $('#selclear').addEventListener('click', () => { batchQ.sel = null; });
  $('#vdl').addEventListener('click', e => {                     // single photo: share sheet when the phone can, else the link
    if (PLATFORM !== 'ios') return;
    const p = guest.photos[cur], f = fileCache.get(p.id);
    if (f){ e.preventDefault(); shareFiles([f]); }
    else toast('Saving to Files — use the share sheet next time');
  });
  $('#sx').addEventListener('click', slideExit);
  $('#sfav').addEventListener('click', () => { show_.fav = !show_.fav; slideshow(true); });
  document.querySelectorAll('#show [data-sp]').forEach(b => b.addEventListener('click', () => {
    sreel.secs = +b.dataset.sp; document.querySelectorAll('#show [data-sp]').forEach(x => x.classList.toggle('on', x === b)); }));
  $('#selclear').addEventListener('click', () => { sel.clear(); updateSel(); });
  let lp = null;                                                        // long-press a thumbnail to (de)select it
  $('#galgrid').addEventListener('pointerdown', e => { const g = e.target.closest('.g'); if (!g) return;
    if ($('#gal').classList.contains('selecting')) return;
    lp = setTimeout(() => { lp = null; const i = +g.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); updateSel(); toast(sel.has(i) ? 'Selected' : 'Removed from selection'); }, 450); });
  ['pointerup', 'pointercancel', 'pointerleave', 'pointermove'].forEach(t => $('#galgrid').addEventListener(t, e => { if (t !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 6){ clearTimeout(lp); lp = null; } }));
  const toggleSelecting = () => { const on = $('#gal').classList.toggle('selecting'); updateSel(); if (on && !sel.size) toast('Tap photos to select them'); };
  $('#selmode').addEventListener('click', toggleSelecting);
  $('#vsel').addEventListener('click', toggleSelecting);
  $('#vpic').addEventListener('click', () => { if ($('#gal').classList.contains('selecting')){ sel.has(cur) ? sel.delete(cur) : sel.add(cur); updateSel(); } });
  $('#galgrid').addEventListener('click', e => {
    const g = e.target.closest('.g'); if (!g) return;
    const i = +g.dataset.i;
    if ($('#gal').classList.contains('selecting')){ sel.has(i) ? sel.delete(i) : sel.add(i); updateSel(); show(i, true); return; }
    show(i);
  });
  $('#prev').addEventListener('click', () => show(cur - 1));
  $('#next').addEventListener('click', () => show(cur + 1));
  $('#dlsel').addEventListener('click', () => zipDownload([...sel].sort((a, b) => a - b), 'selection'));
  $('#gbBtn').addEventListener('click', openGuestbook);
  $('#gbBtn2').addEventListener('click', openGuestbook);
  $('#gbClose').addEventListener('click', () => $('#gbbox').classList.remove('open'));
  $('#gbSend').addEventListener('click', sendNote);
  $('#gbmsg').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendNote(); e.stopPropagation(); });
  $('#dlall').addEventListener('click', () => {
    if (guest.wbytes != null){ const a = document.createElement('a'); a.href = `${FILES}/g/${key}-web.zip`; a.download = ''; a.click(); toast('Your zip is on its way'); }
    else if (guest.zip){ const a = document.createElement('a'); a.href = `${FILES}/g/${key}.zip`; a.download = ''; a.click(); toast('Your zip is on its way'); }
    else zipDownload(guest.photos.map((_, i) => i), 'all');
  });
  addEventListener('keydown', e => {
    if (show_.on){ if (e.key === 'Escape') slideExit(); return; }
    if (!$('#gal').classList.contains('open')) return;
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'Escape'){ if ($('#gbbox').classList.contains('open')) return $('#gbbox').classList.remove('open'); closeGallery(); }
  });
  let sx = 0, sy = 0;
  $('#viewer').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
  $('#viewer').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1));
  });
  addEventListener('resize', () => { if (!isMobile() && !gather) buildDrift(ambientList()); });
}

function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
