<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15120e">
<title>Susie & Dima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#15120e; --ink:#f3ede4; --dim:#a89f92; --paper:#fbf9f4; --accent:#d9b56c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
            font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%,transparent 40%,#000a 100%)}
  button{font:inherit}

  /* ---------- hero ---------- */
  #hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;pointer-events:none;z-index:20;padding:24px;transition:opacity .4s,transform .4s}
  #hero.gone{opacity:0;transform:scale(.96)}
  #hero.gone > *{pointer-events:none}
  #hero > *{pointer-events:auto}
  #hero::before{content:"";position:absolute;width:min(70vw,720px);height:min(50vh,360px);border-radius:50%;
    background:radial-gradient(ellipse,#15120ee6 0%,#15120eaa 45%,transparent 72%);z-index:-1}
  #hero h1{font:italic 400 clamp(44px,8vw,92px)/1 "Cormorant Garamond",serif;letter-spacing:.02em;
           text-shadow:0 2px 30px #000c,0 0 80px #0009}
  #hero h1 span{font-style:normal;font-weight:600}
  #sub{margin-top:10px;color:var(--dim);letter-spacing:.32em;text-transform:uppercase;font-size:12px;text-shadow:0 1px 12px #000;white-space:nowrap}
  #greet{margin-top:0;font:italic 400 clamp(40px,7vw,72px)/1.1 "Cormorant Garamond",serif;color:var(--ink);
         text-shadow:0 2px 20px #000c;display:none}
  #greet b{font-style:normal;font-weight:600;color:var(--accent)}
  #greet small{display:block;font-size:.72em;color:var(--dim);margin-top:4px}
  #greet.on{display:block}
  #cta{position:relative;margin-top:26px;padding:15px 26px 15px 22px;border:0;border-radius:999px;background:var(--ink);
       color:var(--bg);font:600 14px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
       display:inline-flex;align-items:center;gap:10px;box-shadow:0 10px 30px #0009,0 0 0 0 #f3ede466;
       transition:transform .2s,opacity .3s,box-shadow .2s;animation:pulse 2.4s ease-out infinite}
  #cta svg{width:20px;height:20px;flex:none}
  #cta .chev{margin-left:2px;font-weight:400;font-size:16px;opacity:.7}
  #cta:hover{transform:translateY(-1px) scale(1.03);animation:none;box-shadow:0 14px 34px #000b}
  #cta:active{transform:scale(.98)}
  @keyframes pulse{0%{box-shadow:0 10px 30px #0009,0 0 0 0 #f3ede466}70%{box-shadow:0 10px 30px #0009,0 0 0 14px #f3ede400}100%{box-shadow:0 10px 30px #0009,0 0 0 0 #f3ede400}}
  #tophint{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;z-index:21;display:none;justify-content:center;
           pointer-events:none}
  #tophint span{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:#1f1a15;
                color:var(--ink);font-size:11.5px;letter-spacing:.06em;border:1px solid #ffffff22;box-shadow:0 4px 18px #000a}
  #tophint svg{width:15px;height:15px}
  #hero.gone ~ #tophint{opacity:0}
  #cta.busy{opacity:.6;pointer-events:none}
  #hint{margin-top:14px;color:var(--dim);font-size:11.5px;letter-spacing:.06em;opacity:.8}

  /* ---------- desktop: drifting polaroids ---------- */
  #drift{position:fixed;inset:0;overflow:hidden}
  .card{position:absolute;left:0;top:0;background:var(--paper);padding:11px 11px 40px;
        box-shadow:0 12px 40px #000b,0 2px 6px #0008;will-change:transform;cursor:grab;transition:box-shadow .3s;
        user-select:none;-webkit-user-drag:none;touch-action:none}
  .card.drag{cursor:grabbing}
  .card img{display:block;width:100%;height:auto;background:#222;pointer-events:none;-webkit-user-drag:none}
  .card:hover{box-shadow:0 30px 70px #000d,0 4px 10px #000a}

  /* ---------- mobile: film reel ---------- */
  #reel{display:none;position:fixed;inset:0;overflow:hidden;transform:rotate(-2.5deg) scale(1.12);touch-action:none}
  #strip{position:absolute;left:50%;top:-6vh;width:86vw;transform:translateX(-50%);
         background:#0b0a09;padding:0 9vw;box-shadow:0 0 60px #000,inset 0 0 0 1px #000}
  #strip::before,#strip::after{content:"";position:absolute;top:0;bottom:0;width:4.2vw;
    background:repeating-linear-gradient(to bottom,transparent 0 2.4vw,#3a3631 2.4vw 5.2vw,transparent 5.2vw 7.6vw);opacity:.9}
  #strip::before{left:2.2vw} #strip::after{right:2.2vw}
  #track{will-change:transform}
  .frame{padding:3.2vw 0}
  .frame img{display:block;width:100%;height:auto;border:1px solid #000;filter:saturate(1.05) contrast(1.04);
             -webkit-user-drag:none;pointer-events:none}
  @media (max-width:767px), (pointer:coarse) and (max-width:1024px){
    #drift{display:none} #reel{display:block}
    #hero{justify-content:flex-end;padding-bottom:max(48px,env(safe-area-inset-bottom) + 34px)}
    #hero::before{width:100vw;height:60vh;bottom:0;border-radius:0;
      background:linear-gradient(to bottom,transparent,#15120ecc 45%,#15120ef5)}
    #hero h1{font-size:clamp(40px,12vw,64px)} #sub{font-size:10.5px;letter-spacing:.22em} #cta{margin-top:18px}
    #greet{font-size:clamp(36px,11vw,52px)}
    #hint{display:none} #tophint{display:flex;transition:opacity .4s}
  }

  /* ---------- shared UI ---------- */
  .btn{padding:10px 16px;border:1px solid #f3ede455;border-radius:999px;background:transparent;color:var(--ink);
       font:500 12px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;
       text-decoration:none;display:inline-block}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn.on{background:var(--accent);color:#15120e;border-color:var(--accent)}
  .btn:disabled{opacity:.35;cursor:default}
  .overlay{position:fixed;inset:0;z-index:40;background:#15120ef2;backdrop-filter:blur(14px);display:flex;
           opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease,visibility 0s .55s}
  .overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .55s ease,visibility 0s}
  #fade{position:fixed;inset:0;z-index:35;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
  #fade.on{opacity:1}
  #confetti{position:fixed;inset:0;z-index:48;pointer-events:none}

  /* ---------- key prompt ---------- */
  #keybox{align-items:center;justify-content:center;padding:24px}
  #keybox form{width:min(440px,100%);text-align:center}
  #keybox h2{font:italic 400 34px/1.1 "Cormorant Garamond",serif;margin-bottom:10px}
  #keybox p{color:var(--dim);font-size:14px;margin-bottom:22px;line-height:1.5}
  #keyin{width:100%;padding:14px 18px;border:1px solid #f3ede455;border-radius:12px;background:#0000;color:var(--ink);
         font:500 20px/1 Inter,sans-serif;letter-spacing:.06em;text-align:center;text-transform:lowercase;outline:none}
  #keyin:focus{border-color:var(--accent)}
  #keyerr{color:#ff9c9c;font-size:13px;min-height:20px;margin-top:10px}
  #keybox .row{display:flex;gap:10px;justify-content:center;margin-top:14px}

  /* ---------- gallery: viewer + grid ---------- */
  #gal{flex-direction:column;overflow:hidden}
  #galbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #ffffff14;flex-wrap:wrap}
  #galbar h2{font:italic 400 24px/1 "Cormorant Garamond",serif;flex:1;min-width:0;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  #galbar h2 b{font-style:normal;font-weight:600}
  #galbar .n{color:var(--dim);font-size:13px;white-space:nowrap}
  #galbody{flex:1;min-height:0;display:flex}
  #viewer{position:relative;flex:1.5;min-width:0;min-height:0;display:flex;flex-direction:column;background:#0a0908;
          touch-action:pan-y}
  #vpic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
  #vpic img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 50px #000;transition:opacity .2s}
  #vpic img.swap{opacity:0}
  #vbar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px;flex-wrap:wrap;
        border-top:1px solid #ffffff10}
  #vbar .n{color:var(--dim);font-size:12px;margin-right:6px}
  .nav{position:absolute;top:40%;width:44px;height:44px;border-radius:50%;border:0;background:#fff2;color:#fff;
       font-size:22px;cursor:pointer;z-index:1}
  #prev{left:10px} #next{right:10px}
  #galgrid{width:36%;min-width:260px;overflow-y:auto;padding:12px;display:grid;gap:8px;align-content:start;
           grid-template-columns:repeat(auto-fill,minmax(110px,1fr));-webkit-overflow-scrolling:touch;
           border-left:1px solid #ffffff10}
  .g{position:relative;aspect-ratio:1;background:#000;cursor:pointer;overflow:hidden;border-radius:4px;
     outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s}
  .g.cur{outline-color:var(--ink)}
  .g img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
  .g .tick{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;
           background:#0006;display:none;place-items:center;font-size:13px;color:transparent}
  #gal.selecting .g .tick{display:grid}
  .g.sel .tick{background:var(--accent);border-color:var(--accent);color:#15120e}
  .g.sel img{opacity:.7}
  #galfoot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid #ffffff14;justify-content:flex-end;
           flex-wrap:wrap;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  #galfoot .hint{flex:1;color:var(--dim);font-size:12px;align-self:center;min-width:160px}
  @media (max-width:767px), (pointer:coarse) and (max-width:1024px){
    #galbody{flex-direction:column}
    #viewer{flex:none;height:46%}
    #vpic{padding:8px}
    .nav{display:none}
    #galgrid{width:auto;min-width:0;flex:1;min-height:0;border-left:0;border-top:1px solid #ffffff10;
             grid-template-columns:repeat(4,1fr);gap:3px;padding:4px}
    .g{border-radius:2px}
    #galbar{padding:10px 12px} #galbar h2{font-size:20px} #galbar .n{display:none}
    #galfoot{gap:8px;padding:10px 12px} .btn{padding:10px 12px;font-size:11px}
    #galfoot .hint{display:none}
  }

  /* ---------- booth strip + guestbook ---------- */
  #stripbox,#gbbox{align-items:center;justify-content:center;padding:20px;z-index:52}
  #stripbox .box{display:flex;flex-direction:column;align-items:center;gap:14px;max-height:100%}
  #stripimg{max-height:72vh;max-width:min(92vw,400px);box-shadow:0 24px 70px #000;background:#fbf9f4}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #gbbox .box{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;gap:12px}
  #gbbox h2{font:italic 400 32px/1.1 "Cormorant Garamond",serif}
  #gbbox .sub{color:var(--dim);font-size:13px;margin-top:-6px}
  #gbmsg{width:100%;min-height:100px;padding:12px 14px;border:1px solid #f3ede455;border-radius:12px;background:#0000;
         color:var(--ink);font:inherit;resize:vertical;outline:none}
  #gbmsg:focus{border-color:var(--accent)}
  #gbwall{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding-right:4px}
  .note{background:#ffffff0a;border:1px solid #ffffff12;border-radius:10px;padding:10px 14px;font-size:14px}
  .note b{color:var(--accent);font-weight:500} .note small{color:var(--dim);margin-left:8px;font-size:11px}
  .note p{white-space:pre-wrap;margin-top:3px}
  #gbempty{color:var(--dim);font-size:13px;text-align:center;padding:14px}
  #gbBtn{margin-top:12px;background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;letter-spacing:.06em;
         cursor:pointer;text-decoration:underline;text-underline-offset:4px;display:none}
  #gbBtn.on{display:inline} #gbBtn:hover{color:var(--ink)}
  #gbBtn2{display:none} #gbBtn2.on{display:inline-block}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f3ede4;color:#15120e;
         padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;z-index:60;
         pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1}
</style>
</head>
<body>

<div id="drift"></div>
<div id="reel"><div id="strip"><div id="track"></div></div></div>
<div id="fade"></div>
<canvas id="confetti"></canvas>

<div id="tophint"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>Drag the film to scroll it</span></div>
<div id="hero">
  <h1>Susie <span>&amp;</span> Dima</h1>
  <p id="sub">Thank you for celebrating with us</p>
  <p id="greet"></p>
  <button id="cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/></svg><span id="ctatxt">Show my photos</span><span class="chev">›</span></button>
  <p id="hint"></p>
  <button id="gbBtn">Leave us a note ✍</button>
</div>

<div id="keybox" class="overlay">
  <form id="keyform">
    <h2>Your photos</h2>
    <p>Type the name from your personal link<br>e.g. <em>arthur-and-naz</em></p>
    <input id="keyin" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="your-name">
    <div id="keyerr"></div>
    <div class="row">
      <button type="button" class="btn" id="keycancel">Back</button>
      <button type="submit" class="btn primary">Open</button>
    </div>
  </form>
</div>

<div id="gal" class="overlay">
  <div id="galbar">
    <h2 id="galtitle"></h2>
    <span class="n" id="galn"></span>
    <button class="btn" id="gbBtn2">Guestbook</button>
    <button class="btn" id="selmode">Select</button>
    <button class="btn" id="galclose">Close</button>
  </div>
  <div id="galbody">
    <div id="viewer">
      <button class="nav" id="prev" aria-label="Previous">‹</button>
      <button class="nav" id="next" aria-label="Next">›</button>
      <div id="vpic"><img id="vimg" alt=""></div>
      <div id="vbar">
        <span class="n" id="vn"></span>
        <a class="btn primary" id="vdl" download>↓ Original</a>
        <button class="btn" id="vsel">Select</button>
      </div>
    </div>
    <div id="galgrid"></div>
  </div>
  <div id="galfoot">
    <span class="hint" id="galhint"></span>
    <button class="btn" id="stripBtn" disabled>Booth strip</button>
    <button class="btn" id="dlsel" disabled>Download selected</button>
    <button class="btn primary" id="dlall">Download all</button>
  </div>
</div>
<div id="stripbox" class="overlay"><div class="box">
  <img id="stripimg" alt="Your photo-booth strip">
  <div class="row">
    <a class="btn primary" id="stripSave" download="SusieAndDima_booth_strip.jpg">↓ Save</a>
    <button class="btn" id="stripShare">Share</button>
    <button class="btn" id="stripClose">Close</button>
  </div>
</div></div>

<div id="gbbox" class="overlay"><div class="box">
  <h2>Guestbook</h2>
  <div class="sub">A line for Susie &amp; Dima — everyone with a link can read these.</div>
  <textarea id="gbmsg" maxlength="600" placeholder="Write something…"></textarea>
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="gbClose">Close</button>
    <button class="btn primary" id="gbSend">Send</button>
  </div>
  <div id="gbwall"><div id="gbempty">Loading notes…</div></div>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
const $ = s => document.querySelector(s);
const mb = b => (b / 1e6).toFixed(b < 20e6 ? 1 : 0) + ' MB';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const isMobile = () => matchMedia('(max-width:767px), (pointer:coarse) and (max-width:1024px)').matches;
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
                del: k => { try { localStorage.removeItem(k); } catch (e) {} } };

const FILES_FALLBACK = 'https://pub-24efede884af4056b17024d7b118e97a.r2.dev';
let FILES = '', GUESTBOOK = '', showcase = [], guest = null, key = '', pendingKey = '', cur = 0, revealed = false;
const sel = new Set();
const AMBIENT_TOTAL = 20, AMBIENT_GUEST_MAX = 10, CLIENT_ZIP_MAX = 400e6;

(async function init(){
  const fresh = {cache: 'no-store'};
  let cfg = {};
  try { cfg = await fetch('config.json', fresh).then(r => r.json()); } catch (e) {}
  try { showcase = await fetch('showcase.json', fresh).then(r => r.json()); } catch (e) { showcase = []; }
  FILES = (new URLSearchParams(location.search).get('files') || cfg.files || FILES_FALLBACK).replace(/\/$/, '');
  GUESTBOOK = (new URLSearchParams(location.search).get('guestbook') || cfg.guestbook || '').replace(/\/$/, '');
  ambient(); wire(); requestAnimationFrame(tick);
  const fromHash = decodeURIComponent(location.hash.replace(/^#\/?(k=)?/, '')).trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
  pendingKey = fromHash || store.get('key') || '';
  if (pendingKey) loadGuest(pendingKey);
})();

/* ================= guest ================= */
async function loadGuest(k){
  $('#cta').classList.add('busy');
  try {
    const r = await fetch(`${FILES}/g/${encodeURIComponent(k)}.json`, {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    guest = await r.json(); key = k; pendingKey = '';
    store.set('key', k);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    $('#hero h1').style.display = 'none';                     // whose wedding it is goes without saying
    $('#greet').innerHTML = `Hi <b>${esc(guest.name)}</b>`;
    $('#greet').classList.add('on'); $('#hero').insertBefore($('#greet'), $('#sub'));
    $('#sub').textContent = 'Thanks for celebrating with us';
    $('#ctatxt').textContent = `See your photos (${guest.count})`;
    $('#hint').textContent = 'Drag a photo to throw it';
    renderGallery(); ambient();
    if (GUESTBOOK){ $('#gbBtn').classList.add('on'); $('#gbBtn2').classList.add('on'); }
    return true;
  } catch (e) {
    if (store.get('key') === k) store.del('key');
    loadGuest.err = String(e.message || e);
    return false;
  } finally { $('#cta').classList.remove('busy'); }
}

/* ================= ambient photo mix ================= */
const url = (kind, p) => `${FILES}/${kind}/${p.id}.${kind === 'o' ? p.ext : 'jpg'}`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function ambientList(){
  const pinned = showcase.filter(p => p.pin), rest = shuffle(showcase.filter(p => !p.pin));
  const mine = guest ? pickDiverse(guest.photos, AMBIENT_GUEST_MAX).map(p => ({f: url('p', p), w: p.w, h: p.h})) : [];
  const fill = rest.slice(0, Math.max(0, AMBIENT_TOTAL - pinned.length - mine.length));
  // The guest's own photos lead and alternate with ours: with 10 they rotate all the way through,
  // with a few they sit right at the start so the first thing anyone sees is themselves.
  const ours = shuffle([...pinned, ...fill]), out = [];
  for (let i = 0, j = 0; i < mine.length || j < ours.length;){
    if (i < mine.length) out.push(mine[i++]);
    if (j < ours.length) out.push(ours[j++]);
  }
  return out;
}
function ambient(){ const list = ambientList(); buildReel(list); buildDrift(list); }
// Greedy farthest-first on the perceptual hash the build attaches to each photo: burst shots of one
// moment look alike, so they rarely both get picked. Falls back to random if hashes are missing.
function pickDiverse(photos, n){
  if (photos.length <= n) return shuffle(photos);
  if (!photos.every(p => p.h)) return shuffle(photos).slice(0, n);
  const dist = (a, b) => { let x = BigInt('0x' + a) ^ BigInt('0x' + b), c = 0; while (x){ c += Number(x & 1n); x >>= 1n; } return c; };
  const pool = shuffle(photos), out = [pool.pop()];
  while (out.length < n && pool.length){
    let best = -1, bi = 0;
    pool.forEach((p, i) => { const d = Math.min(...out.map(o => dist(o.h, p.h))) + Math.random() * .5; if (d > best){ best = d; bi = i; } });
    out.push(pool.splice(bi, 1)[0]);
  }
  return shuffle(out);
}

/* ================= mobile film reel ================= */
const SECS_PER_PHOTO = 3.2;                                  // resting pace
const reel = { y: 0, speed: 0, n: 0, run: null, touch: null, coast: 0 };
function buildReel(list){
  const t = $('#track');
  t.innerHTML = (list.map(p => `<div class="frame"><img src="${p.f}" alt="" loading="lazy"></div>`).join('')).repeat(2);
  reel.n = list.length; reel.y = 0;
}
function reelTick(dt){
  const t = $('#track'), half = t.offsetHeight / 2;
  if (!half || !reel.n) return;
  const photoH = half / reel.n, base = photoH / SECS_PER_PHOTO;
  const now = performance.now();
  if (reel.touch){                                           // finger owns it
    reel.speed = 0;
  } else if (reel.run){                                      // the fly-through: brisk, steady, readable
    const p = (now - reel.run.t0) / reel.run.dur;
    reel.speed += (reel.run.pps * photoH - reel.speed) * Math.min(1, dt * 5);
    if (p >= 1){ const d = reel.run.done; reel.run = null; d && d(); }
  } else if (now < reel.coast){                              // momentum after a flick, easing back to base
    reel.speed += (base - reel.speed) * Math.min(1, dt * 1.5);
  } else {
    reel.speed += (base - reel.speed) * Math.min(1, dt * 4);
  }
  reel.y = ((reel.y + reel.speed * dt) % half + half) % half;
  t.style.transform = `translateY(${-reel.y}px)`;
}
function wireReel(){
  const el = $('#reel');
  el.addEventListener('touchstart', e => {
    if (reel.run) return;
    const y = e.touches[0].clientY;
    reel.touch = {y, ly: y, lt: performance.now(), v: 0};
  }, {passive: true});
  el.addEventListener('touchmove', e => {
    const s = reel.touch; if (!s) return;
    const y = e.touches[0].clientY, now = performance.now(), dt = Math.max(1, now - s.lt) / 1000;
    const dy = y - s.ly; s.ly = y; s.lt = now;
    s.v = s.v * .4 + (-dy / dt) * .6;                          // content follows the finger (finger up = film up)
    const half = $('#track').offsetHeight / 2;
    reel.y = ((reel.y - dy) % half + half) % half;
  }, {passive: true});
  const end = () => {
    const s = reel.touch; if (!s) return;
    reel.touch = null; reel.speed = clamp(s.v, -4000, 4000); reel.coast = performance.now() + 1800;
  };
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
}
function flyThrough(photos, secs, done){ reel.run = {t0: performance.now(), dur: secs * 1000, pps: photos / secs, done}; }

/* ================= desktop drifting polaroids (drag to throw) ================= */
const cards = [];
let gather = null;
function buildDrift(list){
  const wrap = $('#drift'); wrap.innerHTML = ''; cards.length = 0;
  const W = innerWidth, H = innerHeight, n = list.length;
  const base = Math.min(270, W / Math.max(5.6, Math.sqrt(n) * 1.9));
  list.forEach((p, i) => {
    const el = document.createElement('div'); el.className = 'card';
    const w = p.w >= p.h ? base * 1.15 : base * 0.82;
    el.style.width = w + 'px';
    el.innerHTML = `<img src="${p.f}" alt="" draggable="false">`;
    wrap.appendChild(el);
    const h = w * (p.h / p.w) + 51;
    const c = { el, w, h,
      x: (i % 2 ? W * .55 : 0) + Math.random() * (W * .45 - w * .6),
      y: (Math.floor(i / 2) / Math.ceil(n / 2)) * (H - h * .6) + Math.random() * 40 - 20,
      vx: (Math.random() < .5 ? -1 : 1) * (8 + Math.random() * 10),
      vy: (Math.random() < .5 ? -1 : 1) * (5 + Math.random() * 8),
      rot: -9 + Math.random() * 18, rotv: (Math.random() - .5) * 1.2, hover: false, lift: 0, drag: null, flung: false };
    el.addEventListener('mouseenter', () => { if (!c.drag) c.hover = true; el.style.zIndex = 30; });
    el.addEventListener('mouseleave', () => { if (!c.drag){ c.hover = false; el.style.zIndex = ''; } });
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag');
      c.drag = {ox: e.clientX - c.x, oy: e.clientY - c.y, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY,
                lt: performance.now(), vx: 0, vy: 0};
      c.hover = true; el.style.zIndex = 31;
    });
    el.addEventListener('pointermove', e => {
      const d = c.drag; if (!d) return;
      const now = performance.now(), dt = Math.max(1, now - d.lt) / 1000;
      d.vx = d.vx * .5 + ((e.clientX - d.lx) / dt) * .5; d.vy = d.vy * .5 + ((e.clientY - d.ly) / dt) * .5;
      d.lx = e.clientX; d.ly = e.clientY; d.lt = now;
      c.x = e.clientX - d.ox; c.y = e.clientY - d.oy;
    });
    const release = e => {
      const d = c.drag; if (!d) return;
      c.drag = null; el.classList.remove('drag'); c.hover = false; el.style.zIndex = '';
      if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return ctaClick();
      c.vx = clamp(d.vx, -1600, 1600); c.vy = clamp(d.vy, -1600, 1600);
      c.rotv = clamp(c.vx / 40, -90, 90); c.flung = true;
    };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release);
    cards.push(c);
  });
}
function driftTick(dt){
  const W = innerWidth, H = innerHeight;
  for (const c of cards){
    if (gather){
      const p = clamp((performance.now() - gather.t0) / gather.dur, 0, 1), e = p * p * (3 - 2 * p);
      if (!c.g0) c.g0 = {x: c.x, y: c.y, r: c.rot};
      c.x = c.g0.x + (W / 2 - c.w / 2 - c.g0.x) * e; c.y = c.g0.y + (H / 2 - c.h / 2 - c.g0.y) * e;
      c.rot = c.g0.r * (1 - e) + e * 720 * (cards.indexOf(c) % 2 ? 1 : -1) * p * p;
      c.el.style.opacity = 1 - p * p;
      c.el.style.transform = `translate(${c.x}px,${c.y}px) rotate(${c.rot}deg) scale(${1 - .7 * e})`;
      continue;
    }
    if (!c.hover && !c.drag){
      c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.rotv * dt;
      if (c.x < -c.w * .35) c.vx = Math.abs(c.vx);
      if (c.x > W - c.w * .65) c.vx = -Math.abs(c.vx);
      if (c.y < -c.h * .35) c.vy = Math.abs(c.vy);
      if (c.y > H - c.h * .65) c.vy = -Math.abs(c.vy);
      if (c.flung){
        const f = Math.pow(.15, dt); c.vx *= f; c.vy *= f; c.rotv *= f;
        if (Math.hypot(c.vx, c.vy) < 25){ c.flung = false; c.rotv = (Math.random() - .5) * 1.2; }
      } else if (Math.abs(c.rot) > 12) c.rotv = -c.rotv;
    }
    c.lift += ((c.hover || c.drag ? 1 : 0) - c.lift) * Math.min(1, dt * 8);
    c.el.style.transform = `translate(${c.x}px,${c.y}px) rotate(${c.rot * (1 - c.lift)}deg) scale(${1 + c.lift * .08})`;
  }
  if (gather && performance.now() - gather.t0 >= gather.dur){ const d = gather.done; gather = null; d && d(); }
}
function gatherCards(dur, done){ gather = {t0: performance.now(), dur, done}; }

/* ================= animation loop ================= */
let last = performance.now();
function tick(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  isMobile() ? reelTick(dt) : driftTick(dt);
  requestAnimationFrame(tick);
}

/* ================= the reveal ================= */
async function ctaClick(){
  if (!guest && pendingKey){                                 // link had a name but the load failed: try again first
    if (await loadGuest(pendingKey)) return reveal();
    openKeybox(`Couldn't load "${pendingKey}" (${loadGuest.err || 'network'}) — check your connection and try again`);
    $('#keyin').value = pendingKey; return;
  }
  if (!guest) return openKeybox('');
  reveal();
}
function reveal(){
  $('#hero').classList.add('gone');
  const first = !revealed;
  const finish = () => {
    $('#fade').classList.add('on');
    setTimeout(() => { showGallery(); setTimeout(() => $('#fade').classList.remove('on'), 150); if (first) confetti(); }, 420);
  };
  if (isMobile()) flyThrough(first ? 15 : 6, first ? 4.2 : 1.8, finish);   // ~15 photos in ~4 s, readable, no blur
  else gatherCards(first ? 1500 : 900, () => { finish(); setTimeout(() => buildDrift(ambientList()), 800); });
}
function showGallery(){ revealed = true; $('#gal').classList.add('open'); }
function closeGallery(){ $('#gal').classList.remove('open'); $('#hero').classList.remove('gone'); }

/* ================= confetti ================= */
function confetti(){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#d9b56c', '#fbf9f4', '#ff8b5a', '#c9a2ff', '#8fd3c8'], W = innerWidth, H = innerHeight;
  const ps = Array.from({length: 140}, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45,
    vx: (Math.random() - .5) * 900, vy: -300 - Math.random() * 700, r: 3 + Math.random() * 5,
    a: Math.random() * 6.3, av: (Math.random() - .5) * 12, c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  setTimeout(() => ctx.clearRect(0, 0, W, H), 2600);
  (function frame(now){
    const t = (now - t0) / 1000; if (t > 2.2){ ctx.clearRect(0, 0, W, H); return; }
    ctx.clearRect(0, 0, W, H);
    for (const p of ps){
      p.vy += 1400 / 60; p.vx *= .985; p.x += p.vx / 60; p.y += p.vy / 60; p.a += p.av / 60;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = clamp(2.2 - t, 0, 1);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); ctx.restore();
    }
    requestAnimationFrame(frame);
  })(t0);
}

/* ================= key prompt ================= */
function openKeybox(msg){ $('#keyerr').textContent = msg || ''; $('#keybox').classList.add('open'); setTimeout(() => $('#keyin').focus(), 50); }

/* ================= gallery ================= */
function renderGallery(){
  $('#galtitle').innerHTML = `Hi <b>${esc(guest.name)}</b> — your photos`;
  $('#galn').textContent = `${guest.count} photos · ${mb(guest.bytes)}`;
  $('#galgrid').innerHTML = guest.photos.map((p, i) =>
    `<div class="g" data-i="${i}"><img src="${url('t', p)}" alt="" loading="lazy"><span class="tick">✓</span></div>`).join('');
  $('#dlall').textContent = guest.zip ? `Download all (${mb(guest.bytes)})` : 'Download all';
  $('#galhint').textContent = guest.zip ? '' :
    `Your set is ${mb(guest.bytes)} — too big for one file. Select a batch at a time, or download singles.`;
  sel.clear(); show(0, true); updateSel();
}
function show(i, instant){
  cur = (i + guest.count) % guest.count;
  const p = guest.photos[cur], img = $('#vimg');
  if (!instant) img.classList.add('swap');
  const pre = new Image(); pre.src = url('p', p);
  pre.onload = () => { if (img.dataset.i == cur){ img.src = pre.src; img.classList.remove('swap'); } };
  img.dataset.i = cur; img.src = pre.complete ? pre.src : img.src; if (pre.complete) img.classList.remove('swap');
  $('#vdl').href = url('o', p); $('#vdl').setAttribute('download', p.name);
  $('#vn').textContent = `${cur + 1} / ${guest.count} · ${mb(p.bytes)}`;
  document.querySelectorAll('.g').forEach(g => g.classList.toggle('cur', +g.dataset.i === cur));
  const g = document.querySelectorAll('.g')[cur]; if (g) g.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  for (const j of [cur + 1, cur - 1]) if (guest.photos[(j + guest.count) % guest.count]) new Image().src = url('p', guest.photos[(j + guest.count) % guest.count]);
  updateSel();
}
function updateSel(){
  document.querySelectorAll('.g').forEach(g => g.classList.toggle('sel', sel.has(+g.dataset.i)));
  const bytes = [...sel].reduce((s, i) => s + guest.photos[i].bytes, 0);
  $('#dlsel').disabled = !sel.size;
  $('#dlsel').textContent = sel.size ? `Download selected (${sel.size} · ${mb(bytes)})` : 'Download selected';
  const sb = $('#stripBtn'); sb.disabled = !(sel.size >= 2 && sel.size <= 4);
  sb.textContent = sel.size ? `Booth strip (${Math.min(sel.size, 4)}/4)` : 'Booth strip';
  $('#vsel').textContent = sel.has(cur) ? '✓ Selected' : 'Select';
  $('#vsel').classList.toggle('on', sel.has(cur));
}

/* ================= downloads ================= */
async function zipDownload(indexes, label){
  const items = indexes.map(i => guest.photos[i]);
  const total = items.reduce((s, p) => s + p.bytes, 0);
  if (total > CLIENT_ZIP_MAX) return toast(`That's ${mb(total)} — please do it in batches under ${mb(CLIENT_ZIP_MAX)}`);
  const btn = $('#dlsel'), was = btn.textContent; btn.disabled = true;
  try {
    const files = {}; let done = 0;
    for (const p of items){
      const r = await fetch(url('o', p)); if (!r.ok) throw new Error('fetch ' + r.status);
      files[p.name] = [new Uint8Array(await r.arrayBuffer()), {level: 0}];
      done += p.bytes; btn.textContent = `Preparing… ${Math.round(done / total * 100)}%`;
    }
    const blob = new Blob([fflate.zipSync(files)], {type: 'application/zip'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `SusieAndDima_${label}.zip`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch (e) {
    toast('Download failed — please try again'); console.error(e);
  } finally { btn.disabled = false; btn.textContent = was; }
}

/* ================= photo-booth strip ================= */
async function makeStrip(indexes){
  const items = indexes.slice(0, 4).map(i => guest.photos[i]);
  const btn = $('#stripBtn'), was = btn.textContent; btn.disabled = true; btn.textContent = 'Developing…';
  try {
    await document.fonts.load('italic 400 48px "Cormorant Garamond"').catch(() => {});
    const imgs = await Promise.all(items.map(p => new Promise((res, rej) => {
      const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = rej; im.src = url('p', p);
    })));
    const W = 720, F = 620, M = 50, G = 26, FOOT = 130;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = M + imgs.length * (F + G) - G + FOOT;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fbf9f4'; ctx.fillRect(0, 0, cv.width, cv.height);
    imgs.forEach((im, i) => {
      const y = M + i * (F + G), s = Math.max(F / im.width, F / im.height), w = im.width * s, h = im.height * s;
      ctx.save(); ctx.beginPath(); ctx.rect(M, y, F, F); ctx.clip();
      ctx.drawImage(im, M + (F - w) / 2, y + (F - h) / 2, w, h); ctx.restore();
      ctx.strokeStyle = '#00000014'; ctx.lineWidth = 1; ctx.strokeRect(M + .5, y + .5, F - 1, F - 1);
    });
    ctx.fillStyle = '#15120e'; ctx.textAlign = 'center';
    ctx.font = 'italic 400 44px "Cormorant Garamond", serif'; ctx.fillText('Susie & Dima', W / 2, cv.height - FOOT + 62);
    ctx.fillStyle = '#8a8178'; ctx.font = '500 15px Inter, sans-serif'; ctx.fillText('M E L B O U R N E   ·   2 0 2 6', W / 2, cv.height - FOOT + 94);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .92));
    makeStrip.file = new File([blob], 'SusieAndDima_booth_strip.jpg', {type: 'image/jpeg'});
    const u = URL.createObjectURL(blob);
    $('#stripimg').src = u; $('#stripSave').href = u;
    $('#stripShare').style.display = (navigator.canShare && navigator.canShare({files: [makeStrip.file]})) ? '' : 'none';
    $('#stripbox').classList.add('open');
  } catch (e) { toast('Could not build the strip — try again'); console.error(e); }
  finally { btn.disabled = false; btn.textContent = was; }
}

/* ================= guestbook ================= */
async function openGuestbook(){
  if (!GUESTBOOK) return;
  $('#gbbox').classList.add('open'); $('#gbmsg').focus();
  const wall = $('#gbwall'); wall.innerHTML = '<div id="gbempty">Loading notes…</div>';
  try {
    const notes = await fetch(`${GUESTBOOK}/notes`, {cache: 'no-store'}).then(r => r.json());
    renderNotes(notes);
  } catch (e) { wall.innerHTML = '<div id="gbempty">Could not load the notes right now</div>'; }
}
function renderNotes(notes){
  const wall = $('#gbwall');
  if (!notes.length){ wall.innerHTML = '<div id="gbempty">No notes yet — be the first</div>'; return; }
  wall.innerHTML = notes.map(n => `<div class="note"><b>${esc(n.name)}</b><small>${new Date(n.ts).toLocaleDateString(undefined, {day: 'numeric', month: 'short'})}</small><p>${esc(n.message)}</p></div>`).join('');
}
async function sendNote(){
  const message = $('#gbmsg').value.trim(); if (!message) return;
  const btn = $('#gbSend'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch(`${GUESTBOOK}/notes`, {method: 'POST', headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify({key, name: guest.name, message})});
    if (!r.ok) throw new Error(r.status);
    $('#gbmsg').value = '';
    const wall = $('#gbwall'); if ($('#gbempty')) wall.innerHTML = '';
    wall.insertAdjacentHTML('afterbegin', `<div class="note"><b>${esc(guest.name)}</b><small>just now</small><p>${esc(message)}</p></div>`);
    toast('Thank you ❤'); confetti();
  } catch (e) { toast('Could not send — please try again'); }
  finally { btn.disabled = false; btn.textContent = 'Send'; }
}

/* ================= wiring ================= */
function wire(){
  wireReel();
  $('#cta').addEventListener('click', ctaClick);
  $('#keycancel').addEventListener('click', () => $('#keybox').classList.remove('open'));
  $('#keyform').addEventListener('submit', async e => {
    e.preventDefault();
    const k = $('#keyin').value.trim().toLowerCase().replace(/\s+/g, '-').replace(/&/g, 'and').replace(/[^a-z0-9-]/g, '');
    if (!k) return;
    $('#keyerr').textContent = 'Checking…';
    if (await loadGuest(k)){ $('#keybox').classList.remove('open'); setTimeout(reveal, 300); }
    else $('#keyerr').textContent = "That name isn't recognised — check the link we sent you";
  });
  $('#galclose').addEventListener('click', closeGallery);
  $('#selmode').addEventListener('click', () => {
    const on = $('#gal').classList.toggle('selecting');
    $('#selmode').classList.toggle('on', on); $('#selmode').textContent = on ? 'Done' : 'Select';
    if (on) toast('Tap photos to pick them, then Download selected');
  });
  $('#galgrid').addEventListener('click', e => {
    const g = e.target.closest('.g'); if (!g) return;
    const i = +g.dataset.i;
    if ($('#gal').classList.contains('selecting')){ sel.has(i) ? sel.delete(i) : sel.add(i); updateSel(); }
    show(i);
  });
  $('#prev').addEventListener('click', () => show(cur - 1));
  $('#next').addEventListener('click', () => show(cur + 1));
  $('#vsel').addEventListener('click', () => { sel.has(cur) ? sel.delete(cur) : sel.add(cur); updateSel(); });
  $('#dlsel').addEventListener('click', () => zipDownload([...sel].sort((a, b) => a - b), 'selection'));
  $('#stripBtn').addEventListener('click', () => makeStrip([...sel].sort((a, b) => a - b)));
  $('#stripClose').addEventListener('click', () => $('#stripbox').classList.remove('open'));
  $('#stripShare').addEventListener('click', () => navigator.share({files: [makeStrip.file], title: 'Susie & Dima'}).catch(() => {}));
  $('#gbBtn').addEventListener('click', openGuestbook);
  $('#gbBtn2').addEventListener('click', openGuestbook);
  $('#gbClose').addEventListener('click', () => $('#gbbox').classList.remove('open'));
  $('#gbSend').addEventListener('click', sendNote);
  $('#gbmsg').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendNote(); e.stopPropagation(); });
  $('#dlall').addEventListener('click', () => {
    if (guest.zip){ const a = document.createElement('a'); a.href = `${FILES}/g/${key}.zip`; a.download = ''; a.click(); toast('Your zip is on its way'); }
    else zipDownload(guest.photos.map((_, i) => i), 'all');
  });
  addEventListener('keydown', e => {
    if (!$('#gal').classList.contains('open')) return;
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'Escape'){ for (const id of ['#stripbox', '#gbbox']) if ($(id).classList.contains('open')) return $(id).classList.remove('open'); closeGallery(); }
  });
  let sx = 0, sy = 0;
  $('#viewer').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
  $('#viewer').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1));
  });
  addEventListener('resize', () => { if (!isMobile() && !gather) buildDrift(ambientList()); });
}

function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}
