<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Susie & Dima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15120e; --ink:#f3ede4; --dim:#a89f92; --paper:#fbf9f4; --accent:#d9b56c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
            font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%,transparent 40%,#000a 100%)}

  /* ---------- hero copy ---------- */
  #hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;pointer-events:none;z-index:20;padding:24px}
  #hero > *{pointer-events:auto}
  #hero::before{content:"";position:absolute;width:min(70vw,720px);height:min(50vh,360px);border-radius:50%;
    background:radial-gradient(ellipse,#15120ee6 0%,#15120eaa 45%,transparent 72%);z-index:-1}
  #hero h1{font:italic 400 clamp(44px,8vw,92px)/1 "Cormorant Garamond",serif;letter-spacing:.02em;
           text-shadow:0 2px 30px #000c,0 0 80px #0009}
  #hero h1 span{font-style:normal;font-weight:600}
  #hero p{margin-top:10px;color:var(--dim);letter-spacing:.32em;text-transform:uppercase;font-size:12px;
          text-shadow:0 1px 12px #000}
  #cta{margin-top:34px;padding:14px 30px;border:1px solid #f3ede4aa;border-radius:999px;background:#15120ecc;
       color:var(--ink);font:500 14px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;
       cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,transform .2s}
  #cta:hover{background:var(--ink);color:var(--bg);transform:translateY(-1px)}

  /* ---------- desktop: drifting polaroids ---------- */
  #drift{position:fixed;inset:0;overflow:hidden}
  .card{position:absolute;left:0;top:0;background:var(--paper);padding:11px 11px 40px;
        box-shadow:0 12px 40px #000b,0 2px 6px #0008;will-change:transform;cursor:pointer;
        transition:box-shadow .3s}
  .card img{display:block;width:100%;height:auto;background:#222}
  .card:hover{box-shadow:0 30px 70px #000d,0 4px 10px #000a}

  /* ---------- mobile: film reel ---------- */
  /* the tilt lives on the viewport-sized container, so it rotates about the screen centre;
     scale hides the corners the rotation would expose */
  #reel{display:none;position:fixed;inset:0;overflow:hidden;transform:rotate(-2.5deg) scale(1.12)}
  #strip{position:absolute;left:50%;top:-6vh;width:86vw;transform:translateX(-50%);
         background:#0b0a09;padding:0 9vw;box-shadow:0 0 60px #000,inset 0 0 0 1px #000}
  #strip::before,#strip::after{content:"";position:absolute;top:0;bottom:0;width:4.2vw;
    background:repeating-linear-gradient(to bottom,transparent 0 2.4vw,#3a3631 2.4vw 5.2vw,transparent 5.2vw 7.6vw);
    opacity:.9}
  #strip::before{left:2.2vw} #strip::after{right:2.2vw}
  #track{animation:roll var(--dur,90s) linear infinite;will-change:transform}
  .frame{padding:3.2vw 0}
  .frame img{display:block;width:100%;height:auto;border:1px solid #000;filter:saturate(1.05) contrast(1.04)}
  @keyframes roll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
  #reel.paused #track{animation-play-state:paused}

  @media (max-width:767px), (pointer:coarse) and (max-width:1024px){
    #drift{display:none} #reel{display:block}
    #hero{justify-content:flex-end;padding-bottom:max(48px,env(safe-area-inset-bottom) + 34px)}
    #hero::before{width:100vw;height:55vh;bottom:0;border-radius:0;
      background:linear-gradient(to bottom,transparent,#15120ecc 45%,#15120ef5)}
    #hero h1{font-size:clamp(40px,12vw,64px)}
    #hero p{font-size:11px}
    #cta{margin-top:22px}
  }

  /* ---------- guest gallery (mock) ---------- */
  #gal{position:fixed;inset:0;z-index:40;background:#15120ef2;backdrop-filter:blur(14px);
       display:none;flex-direction:column;overflow:hidden}
  #gal.open{display:flex}
  #galbar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #ffffff14}
  #galbar h2{font:italic 400 26px/1 "Cormorant Garamond",serif;flex:1}
  #galbar h2 b{font-style:normal;font-weight:600}
  #galbar .n{color:var(--dim);font-size:13px}
  .btn{padding:10px 16px;border:1px solid #f3ede455;border-radius:999px;background:transparent;color:var(--ink);
       font:500 12px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn:disabled{opacity:.35;cursor:default}
  #galgrid{flex:1;overflow-y:auto;padding:16px;display:grid;gap:10px;
           grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-content:start}
  .g{position:relative;aspect-ratio:1;background:#000;cursor:pointer;overflow:hidden;border-radius:4px}
  .g img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s,opacity .2s}
  .g:hover img{transform:scale(1.04)}
  .g .tick{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;
           border:2px solid #fff;background:#0006;display:grid;place-items:center;font-size:14px;color:transparent}
  .g.sel .tick{background:var(--accent);border-color:var(--accent);color:#15120e}
  .g.sel img{opacity:.75}
  .g .dl{position:absolute;left:8px;bottom:8px;padding:6px 10px;border-radius:999px;background:#000a;color:#fff;
         font-size:11px;letter-spacing:.06em;opacity:0;transition:opacity .2s}
  .g:hover .dl{opacity:1}
  #galfoot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid #ffffff14;justify-content:flex-end;
           padding-bottom:max(14px,env(safe-area-inset-bottom))}
  @media (max-width:767px){
    #galgrid{grid-template-columns:repeat(3,1fr);gap:4px;padding:6px}
    .g{border-radius:2px} .g .dl{display:none}
    #galbar h2{font-size:22px}
  }
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f3ede4;color:#15120e;
         padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;z-index:60;
         pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
</style>
</head>
<body>

<div id="drift"></div>

<div id="reel"><div id="strip"><div id="track"></div></div></div>

<div id="hero">
  <h1>Susie <span>&amp;</span> Dima</h1>
  <p>Melbourne · September 2026</p>
  <button id="cta">Show my photos</button>
</div>

<div id="gal">
  <div id="galbar">
    <h2>Hi <b>Priya</b> — your photos</h2>
    <span class="n" id="galn"></span>
    <button class="btn" id="galclose">Close</button>
  </div>
  <div id="galgrid"></div>
  <div id="galfoot">
    <button class="btn" id="dlsel" disabled>Download selected</button>
    <button class="btn primary" id="dlall">Download all</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const isMobile = () => getComputedStyle($('#reel')).display !== 'none';
let photos = [];

(async function init(){
  photos = await (await fetch('img/list.json')).json();
  buildReel(); buildDrift(); buildGallery();
})();

/* ---------- mobile reel ---------- */
function buildReel(){
  const t = $('#track');
  const frames = photos.map(p => `<div class="frame"><img src="img/${p.f}" alt=""></div>`).join('');
  t.innerHTML = frames + frames;                       // doubled so the loop is seamless
  // ~7s per photo feels like a lazy projector; scale with count so speed stays constant
  t.style.setProperty('--dur', (photos.length * 7) + 's');
  const reel = $('#reel');
  let hold;
  reel.addEventListener('touchstart', () => { reel.classList.add('paused'); clearTimeout(hold); }, {passive:true});
  reel.addEventListener('touchend', () => { hold = setTimeout(() => reel.classList.remove('paused'), 1200); });
}

/* ---------- desktop drift ---------- */
const cards = [];
function buildDrift(){
  const wrap = $('#drift');
  const W = innerWidth, H = innerHeight;
  photos.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    const base = Math.min(270, W / 5.6);
    const w = p.w >= p.h ? base * 1.15 : base * 0.82;
    el.style.width = w + 'px';
    el.innerHTML = `<img src="img/${p.f}" alt="">`;
    wrap.appendChild(el);
    const h = w * (p.h / p.w) + 51;
    const c = {
      el, w, h,
      x: (i % 2 ? W * .55 : 0) + Math.random() * (W * .45 - w * .6),
      y: (Math.floor(i / 2) / Math.ceil(photos.length / 2)) * (H - h * .6) + Math.random() * 40 - 20,
      vx: (Math.random() < .5 ? -1 : 1) * (8 + Math.random() * 10),      // px / s — slow
      vy: (Math.random() < .5 ? -1 : 1) * (5 + Math.random() * 8),
      rot: -9 + Math.random() * 18, rotv: (Math.random() - .5) * 1.2,   // deg / s
      hover: false, lift: 0,
    };
    el.addEventListener('mouseenter', () => { c.hover = true; el.style.zIndex = 30; });
    el.addEventListener('mouseleave', () => { c.hover = false; el.style.zIndex = ''; });
    el.addEventListener('click', openGallery);
    cards.push(c);
  });
  let last = performance.now();
  (function tick(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const W = innerWidth, H = innerHeight;
    for (const c of cards){
      if (!c.hover){
        c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.rotv * dt;
        if (c.x < -c.w * .35) c.vx = Math.abs(c.vx);
        if (c.x > W - c.w * .65) c.vx = -Math.abs(c.vx);
        if (c.y < -c.h * .35) c.vy = Math.abs(c.vy);
        if (c.y > H - c.h * .65) c.vy = -Math.abs(c.vy);
        if (Math.abs(c.rot) > 12) c.rotv = -c.rotv;
      }
      c.lift += ((c.hover ? 1 : 0) - c.lift) * Math.min(1, dt * 8);
      const s = 1 + c.lift * .08, r = c.rot * (1 - c.lift);
      c.el.style.transform = `translate(${c.x}px,${c.y}px) rotate(${r}deg) scale(${s})`;
    }
    requestAnimationFrame(tick);
  })(last);
}

/* ---------- gallery mock ---------- */
const sel = new Set();
function buildGallery(){
  $('#galgrid').innerHTML = photos.map((p, i) => `
    <div class="g" data-i="${i}">
      <img src="img/${p.f}" alt="" loading="lazy">
      <span class="tick">✓</span>
      <span class="dl" data-dl="${i}">↓ original</span>
    </div>`).join('');
  $('#galn').textContent = photos.length + ' photos';
  $('#galgrid').addEventListener('click', e => {
    const dl = e.target.closest('[data-dl]');
    if (dl){ toast('Would download original of ' + photos[+dl.dataset.dl].src); return; }
    const g = e.target.closest('.g'); if (!g) return;
    const i = +g.dataset.i;
    sel.has(i) ? sel.delete(i) : sel.add(i);
    g.classList.toggle('sel', sel.has(i));
    $('#dlsel').disabled = !sel.size;
    $('#dlsel').textContent = sel.size ? `Download selected (${sel.size})` : 'Download selected';
  });
  $('#dlsel').addEventListener('click', () => toast(`Would zip ${sel.size} originals for download`));
  $('#dlall').addEventListener('click', () => toast('Would download the pre-built zip of all originals'));
  $('#galclose').addEventListener('click', () => $('#gal').classList.remove('open'));
  $('#cta').addEventListener('click', openGallery);
}
function openGallery(){ $('#gal').classList.add('open'); }

function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
